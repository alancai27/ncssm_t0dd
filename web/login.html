<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T0dd</title>
<link rel="icon" href="/todd-128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ambient.css">
<style>
:root{
  --navy:#0b2447; --steel:#3e77b8; --ice:#d9e8f6; --slate:#5a6b80; --white:#fff;
  --soft-surface:color-mix(in srgb,var(--ice) 42%,var(--white));
  --card-shadow:0 14px 40px rgba(11,36,71,.07);
  --card-shadow-lift:0 20px 48px rgba(11,36,71,.11);
  --font:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{position:relative;font-family:var(--font);background:var(--white);color:var(--navy);
  display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}

@media(prefers-reduced-motion:reduce){}

.card{position:relative;z-index:1;width:min(440px,100%);background:rgba(255,255,255,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid color-mix(in srgb,var(--ice) 70%,var(--white));
  border-radius:24px;box-shadow:var(--card-shadow);padding:38px 34px 30px;text-align:center}

.eyebrow{font-size:11px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--slate);margin-bottom:18px}
.logo{width:118px;height:118px;object-fit:contain;margin:0 auto 6px;display:block}
.logo-fb{width:96px;height:96px;margin:0 auto 6px;border-radius:24px;background:var(--navy);
  color:var(--ice);display:grid;place-items:center;font-size:40px;font-weight:700}
h1{font-size:38px;letter-spacing:-1px;font-weight:700;margin-bottom:7px}
/* DM Sans has no slashed-zero alternate, so its 0 reads as a capital O.
   Borrow the mono stack for this one glyph -- unambiguous, and a code-font
   zero is on-theme for a CS tutor. */
.zero{color:var(--steel);font-size:.88em;
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.sub{color:var(--slate);font-size:14.5px;line-height:1.55;margin-bottom:26px}
.sub b{color:var(--navy);font-weight:600}

.gbtn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
  padding:13px 18px;border-radius:14px;border:1px solid color-mix(in srgb,var(--steel) 26%,var(--ice));
  background:var(--white);color:var(--navy);font:inherit;font-size:15px;font-weight:600;
  text-decoration:none;cursor:pointer;transition:box-shadow .16s,transform .16s,border-color .16s}
.gbtn:hover{box-shadow:var(--card-shadow-lift);transform:translateY(-1px);border-color:var(--steel)}
.gbtn[aria-disabled="true"]{opacity:.5;pointer-events:none}

.hint{margin-top:16px;font-size:12.8px;color:var(--slate)}
.hint code{font-family:ui-monospace,Menlo,monospace;background:var(--soft-surface);
  padding:1px 6px;border-radius:5px;font-size:12px}
.err{margin-bottom:18px;padding:11px 14px;border-radius:12px;font-size:13.5px;text-align:left;
  background:#fdecec;border:1px solid #f2c2c2;color:#8c2f2f}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <span class="ambient__blob ambient__blob--a"></span>
  <span class="ambient__blob ambient__blob--b"></span>
  <span class="ambient__blob ambient__blob--c"></span>
</div>

<main class="card">
  <p class="eyebrow">NCSSM Durham Presents:</p>
  <img class="logo" src="/todd.png" alt="T0dd"
       onerror="this.outerHTML='&lt;div class=&quot;logo-fb&quot;&gt;🦄&lt;/div&gt;'">
  <h1>T<span class="zero">0</span>dd</h1>
  <p class="sub">Your LLM chatbot, ready to help 24/7.</p>

  <!--ERROR-->

  <a class="gbtn" href="/auth/google" id="gbtn">
    <svg width="19" height="19" viewBox="0 0 18 18" aria-hidden="true">
      <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.96 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3-2.33z"/>
      <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
    </svg>
    Continue with Google
  </a>

  <p class="hint"><code>@ncssm.edu</code> accounts only.</p>
</main>
</body></html>
