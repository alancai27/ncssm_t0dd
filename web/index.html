<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T0dd · NCSSM</title>
<link rel="icon" href="/todd-128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* ---- Theme tokens. Retheming = edit this block only. ---- */
:root{
  /* Ported from techinance/styles.css */
  --navy:#0b2447; --steel:#3e77b8; --ice:#d9e8f6; --slate:#5a6b80; --white:#fff;
  --gold:#C8A227;
  --soft-surface:color-mix(in srgb,var(--ice) 42%,var(--white));
  --soft-surface-strong:color-mix(in srgb,var(--ice) 62%,var(--white));
  --card-shadow:0 14px 40px rgba(11,36,71,.07);
  --card-shadow-lift:0 20px 48px rgba(11,36,71,.11);

  --bg:var(--white); --surface:rgba(255,255,255,.82); --surface-2:var(--soft-surface);
  --sidebar:var(--navy);
  --text:var(--navy); --text-2:var(--slate); --text-inv:#eaf0f8;
  --border:color-mix(in srgb,var(--ice) 70%,var(--white));
  --border-2:color-mix(in srgb,var(--steel) 24%,var(--ice));
  --blue:var(--steel); --blue-300:#6f9dd4; --navy-700:#123c74;
  --user-bg:var(--soft-surface-strong); --block-bg:#fff8e6; --block-border:var(--gold);
  --radius:24px; --radius-sm:14px;
  --font:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#070f1c; --surface:rgba(22,31,45,.78); --surface-2:#1a2433; --sidebar:#050b15;
  --text:#e6ecf5; --text-2:#93a6bf; --border:#222f42; --border-2:#31415a;
  --soft-surface:#151f2e; --soft-surface-strong:#1b2637;
  --user-bg:#1a2536; --block-bg:#241f0e; --block-border:#8a7320;
  --blue:#5b93d6; --blue-300:#7fa8e0;
  --card-shadow:0 14px 40px rgba(0,0,0,.34);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{position:relative;font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased}

/* Ambient blobs -- decorative only, behind content. From techinance/ambient.js */
.ambient{position:fixed;z-index:0;inset:0;overflow:hidden;pointer-events:none}
.ambient__blob{position:absolute;border-radius:50%;filter:blur(48px);opacity:.55;will-change:transform}
.ambient__blob--a{top:-8%;left:-6%;width:min(520px,70vw);height:min(520px,70vw);
  background:color-mix(in srgb,var(--ice) 80%,var(--steel));animation:ambient-drift-a 28s ease-in-out infinite}
.ambient__blob--b{top:38%;right:-12%;width:min(440px,60vw);height:min(440px,60vw);
  background:color-mix(in srgb,var(--steel) 28%,var(--ice));opacity:.35;
  animation:ambient-drift-b 34s ease-in-out infinite}
.ambient__blob--c{bottom:-10%;left:22%;width:min(380px,55vw);height:min(380px,55vw);
  background:color-mix(in srgb,var(--ice) 70%,var(--navy));opacity:.28;
  animation:ambient-drift-c 40s ease-in-out infinite}
:root[data-theme="dark"] .ambient__blob{opacity:.20;filter:blur(64px)}
:root[data-theme="dark"] .ambient__blob--b{opacity:.14}
:root[data-theme="dark"] .ambient__blob--c{opacity:.12}
@keyframes ambient-drift-a{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,6%) scale(1.08)}}
@keyframes ambient-drift-b{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5%,-4%) scale(1.06)}}
@keyframes ambient-drift-c{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3%,-5%) scale(1.1)}}
@media(prefers-reduced-motion:reduce){.ambient__blob{animation:none !important}}

.app{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden}

/* ---------- Sidebar ---------- */
.sidebar{width:262px;flex:none;background:var(--sidebar);color:var(--text-inv);
  display:flex;flex-direction:column;padding:16px 12px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 2px}
/* The mark is navy on transparent; on the navy sidebar it needs a light
   chip behind it or it disappears. */
.crest{width:34px;height:34px;flex:none;object-fit:contain;border-radius:9px;
  background:var(--ice);padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.22)}
.crest-fb{border-radius:8px;background:var(--ice);display:grid;place-items:center;font-size:19px}
.brand .zero{color:var(--ice);font-size:.9em;
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.brand h1{font-size:14px;font-weight:650;letter-spacing:-.1px;line-height:1.25}
.brand small{display:block;font-size:11.5px;font-weight:450;color:#9DB4D4}
.newchat{display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:var(--text-inv);border-radius:var(--radius-sm);font:inherit;font-size:13.5px;
  font-weight:550;cursor:pointer;transition:background .15s}
.newchat:hover{background:rgba(255,255,255,.15)}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#7E97BC;
  padding:4px 9px;font-weight:650}
.hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.hist button{text-align:left;background:none;border:0;color:#C6D5E9;font:inherit;
  font-size:13.5px;padding:7px 9px;border-radius:7px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist button:hover{background:rgba(255,255,255,.07);color:#fff}
.hist button.on{background:rgba(255,255,255,.13);color:#fff}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:11px;
  display:flex;flex-direction:column;gap:8px}
.who{font-size:12px;color:#9DB4D4;padding:0 9px;line-height:1.45;overflow:hidden}
.who b{display:block;color:#E3ECF7;font-weight:600;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.themebtn{background:none;border:0;color:#9DB4D4;font:inherit;font-size:12.5px;
  padding:5px 9px;text-align:left;cursor:pointer;border-radius:6px}
.themebtn:hover{background:rgba(255,255,255,.07);color:#fff}
a.themebtn{text-decoration:none;display:block}

/* ---------- Main ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0;background:transparent}
.topbar{height:52px;flex:none;border-bottom:1px solid var(--border);background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}
.topbar .t{font-size:14px;font-weight:600}
.topbar .t span{color:var(--text-2);font-weight:450}
.pill{font-size:11.5px;color:var(--text-2);border:1px solid var(--border);
  padding:3px 9px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.pill.dot::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--blue);margin-right:6px;vertical-align:1px}

.scroll{flex:1;overflow-y:auto}
.col{max-width:47rem;margin:0 auto;padding:22px 24px 8px}


.msg{display:flex;gap:13px;margin-bottom:22px}
.av{width:27px;height:27px;flex:none;border-radius:7px;display:grid;place-items:center;
  font-size:11px;font-weight:700;margin-top:1px}
.av.u{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.av.a{background:var(--navy);color:var(--gold)}
.body{min-width:0;flex:1;padding-top:1px}
.msg.user .body{background:var(--user-bg);border-radius:var(--radius);
  padding:9px 14px;margin-top:-3px}
.body p{margin:0 0 10px}.body p:last-child{margin:0}
.body code{font-family:var(--mono);font-size:.875em;background:var(--surface-2);
  border:1px solid var(--border);padding:1.5px 5px;border-radius:5px}
.body pre{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;overflow-x:auto;margin:10px 0}
.body pre code{background:none;border:0;padding:0;font-size:12.8px;line-height:1.55}

.cite{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  color:var(--blue);background:color-mix(in srgb,var(--blue) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--blue) 26%,transparent);
  padding:1px 8px;border-radius:99px;cursor:pointer;white-space:nowrap}
.cite:hover{background:color-mix(in srgb,var(--blue) 17%,transparent)}

.withheld{display:block;background:var(--block-bg);border:1px solid var(--block-border);
  border-radius:var(--radius-sm);padding:12px 14px;margin:10px 0;font-size:13.5px}
.withheld>span{display:block;}
.withheld b{display:block;color:var(--text);margin-bottom:3px;font-size:13px}
.withheld span{color:var(--text-2)}
.why{display:block;margin-top:9px;font-size:11.5px;color:var(--text-2);font-family:var(--mono);
  border-top:1px dashed var(--border-2);padding-top:7px}

.dots{display:flex;gap:4px;padding:7px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--border-2);
  animation:b 1.3s infinite}
.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ---------- Composer ---------- */
.composer{flex:none;padding:8px 24px 18px;
  background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 88%,transparent) 30%)}
.cwrap{max-width:47rem;margin:0 auto}
.box{display:flex;align-items:flex-end;gap:9px;background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--card-shadow);
  border:1px solid var(--border-2);border-radius:var(--radius);padding:9px 9px 9px 14px;
  transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--blue-300);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 13%,transparent)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--text);
  font:inherit;line-height:1.55;max-height:190px;padding:4px 0}
textarea::placeholder{color:var(--text-2)}
.send{width:31px;height:31px;flex:none;border:0;border-radius:8px;background:var(--navy);
  color:#fff;cursor:pointer;display:grid;place-items:center;transition:opacity .15s}
.send:disabled{opacity:.32;cursor:default}
.send:not(:disabled):hover{background:var(--navy-700)}
.hint{text-align:center;font-size:11.5px;color:var(--text-2);margin-top:9px}
.hint .sep{opacity:.45;margin:0 3px}

@media(max-width:820px){.sidebar{display:none}.col,.cwrap{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <span class="ambient__blob ambient__blob--a"></span>
  <span class="ambient__blob ambient__blob--b"></span>
  <span class="ambient__blob ambient__blob--c"></span>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="crest" src="/todd-128.png" alt=""
           onerror="this.outerHTML='&lt;div class=&quot;crest crest-fb&quot;&gt;🦄&lt;/div&gt;'">
      <h1>T<span class="zero">0</span>dd<small>NCSSM · CS tutor</small></h1>
    </div>
    <button class="newchat" onclick="newChat()">＋ New conversation</button>
    <div class="sect">Recent</div>
    <div class="hist" id="hist"></div>
    <div class="side-foot">
      <div class="who" id="who"><b id="whoName"></b><span id="whoMail"></span></div>
      <button class="themebtn" onclick="toggleTheme()">◐ Toggle theme</button>
      <a class="themebtn" href="/logout">↩ Sign out</a>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="t">CS 2100 <span>· Problem Set 4</span></div>
      <div style="display:flex;gap:7px;align-items:center">
        <span class="pill" id="usage">offline demo</span>
        <span class="pill dot">Qwen3-30B</span>
      </div>
    </div>

    <div class="scroll" id="scroll">
      <div class="col" id="col">
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="cwrap">
        <div class="box">
          <textarea id="ta" rows="1" placeholder="Ask about a concept, or describe where you're stuck…"></textarea>
          <button class="send" id="send" disabled onclick="send()" aria-label="Send">↑</button>
        </div>
        <div class="hint">T0dd can be wrong. Your course modules are the source of truth <span class="sep">·</span> Enter to send, Shift+Enter for newline</div>
      </div>
    </div>
  </main>
</div>

<script>
const col=document.getElementById('col'), scroll=document.getElementById('scroll'),
      ta=document.getElementById('ta'), sendBtn=document.getElementById('send'),
      hist=document.getElementById('hist'), usageEl=document.getElementById('usage');
let history=[], chats=[{title:'PS4 · findMax',msgs:[]}], active=0;

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* Render: paragraph-split FIRST, then inject markup. Injected HTML must stay
   on one line -- the \n -> <br> pass would otherwise shred it. And .why is a
   <span>, not a <div>: block elements inside <p> force the <p> closed. */
function render(t,reasons){
  const blocks=[];
  let h=esc(t).replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{
    blocks.push(`<pre><code>${c.trim()}</code></pre>`); return `\u0000${blocks.length-1}\u0000`; });

  h=h.split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');

  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
     .replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  const why=reasons&&reasons.length
    ? `<span class="why">${esc(reasons.join(' · '))}</span>` : '';
  h=h.replace(/⟨solution withheld⟩/g,
    `<span class="withheld"><b>Solution withheld</b><span>That would have been the answer to the assignment. Try the module below, then tell me where you get stuck.</span>${why}</span>`);
  h=h.replace(/\[Module ([\d.]+)\]/g,'<span class="cite">📘 Module $1</span>');
  return h.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}

function add(role,text,reasons){
  const d=document.createElement('div');
  d.className='msg '+(role==='user'?'user':'a');
  d.innerHTML=`<div class="av ${role==='user'?'u':'a'}">${role==='user'?'You':'NC'}</div>
               <div class="body">${render(text,reasons)}</div>`;
  col.appendChild(d); scroll.scrollTop=scroll.scrollHeight; return d;
}

function thinking(){
  const d=document.createElement('div'); d.className='msg';
  d.innerHTML=`<div class="av a">NC</div><div class="body"><div class="dots"><i></i><i></i><i></i></div></div>`;
  col.appendChild(d); scroll.scrollTop=scroll.scrollHeight; return d;
}

async function send(){
  const msg=ta.value.trim(); if(!msg) return;
  ta.value=''; ta.style.height='auto'; sendBtn.disabled=true;
  add('user',msg); history.push({role:'user',content:msg});
  if(chats[active].msgs.length===0){chats[active].title=msg.slice(0,34); drawHist();}
  chats[active].msgs.push(msg);
  const t=thinking();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg,history})});
    const j=await r.json(); t.remove();
    if(j.error){ add('assistant','⚠️ '+j.error); return; }
    add('assistant',j.text,j.reasons);
    history.push({role:'assistant',content:j.text});
    if(j.usage) usageEl.textContent=j.usage;
  }catch(e){ t.remove(); add('assistant','⚠️ Server unreachable. Is server.py running?'); }
}

function newChat(){
  chats.unshift({title:'New conversation',msgs:[]}); active=0; history=[];
  col.querySelectorAll('.msg').forEach(n=>n.remove()); drawHist();
}
function drawHist(){
  hist.innerHTML='';
  chats.forEach((c,i)=>{ const b=document.createElement('button');
    b.textContent=c.title; b.className=i===active?'on':'';
    b.onclick=()=>{active=i;drawHist();}; hist.appendChild(b); });
}
function toggleTheme(){
  const r=document.documentElement;
  const n=r.dataset.theme==='dark'?'light':'dark';
  r.dataset.theme=n; localStorage.setItem('theme',n);
}
ta.addEventListener('input',()=>{ ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,190)+'px'; sendBtn.disabled=!ta.value.trim(); });
ta.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.keyCode===13)&&!e.shiftKey){e.preventDefault();send();} });
document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';
drawHist(); ta.focus();
fetch('/api/me').then(r=>r.ok?r.json():Promise.reject()).then(j=>{
  document.getElementById('whoName').textContent=j.user.name;
  document.getElementById('whoMail').textContent=j.user.email;
}).catch(()=>location.href='/login');
</script>
</body></html>
